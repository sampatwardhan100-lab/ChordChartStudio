    const NoteIcons = {
      Whole: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="12" rx="6" ry="4" transform="rotate(-15 12 12)" /></svg>,
      Half: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="9" cy="17" rx="5" ry="3.5" transform="rotate(-15 9 17)" /><path d="M13.5 17 V5" /></svg>,
      Quarter: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="17" rx="5" ry="3.5" transform="rotate(-15 9 17)" /><path d="M13.5 17 V5" stroke="currentColor" strokeWidth="2" /></svg>,
      Eighth: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="17" rx="5" ry="3.5" transform="rotate(-15 9 17)" /><path d="M13.5 17 V5" stroke="currentColor" strokeWidth="2" /><path d="M13.5 5 Q 18 8 16 15 C 15 12 14.5 10 13.5 9 Z" /></svg>,
      Sixteenth: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="9" cy="17" rx="5" ry="3.5" transform="rotate(-15 9 17)" /><path d="M13.5 17 V5" stroke="currentColor" strokeWidth="2" /><path d="M13.5 5 Q 17 8 16 13 C 15 11 14.5 10 13.5 9 Z" /><path d="M13.5 9 Q 17 12 16 17 C 15 15 14.5 14 13.5 13 Z" /></svg>
    };

    const sharpKeys = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const flatKeys = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
    const nnsMap = { 0:'1', 1:'b2', 2:'2', 3:'b3', 4:'3', 5:'4', 6:'#4', 7:'5', 8:'b6', 9:'6', 10:'b7', 11:'7' };

    const getNoteIndex = (note) => {
        if (!note) return -1;
        let normalized = note.replace(/♯/g, '#').replace(/♭/g, 'b');
        let i = sharpKeys.indexOf(normalized.toUpperCase());
        if (i === -1) i = flatKeys.findIndex(n => n.toLowerCase() === normalized.toLowerCase());
        return i;
    };

    const transposeChordString = (chordRaw, steps) => {
      if (!chordRaw) return '';
      let cleanText = chordRaw;
      const mods = ['_H', '_S', '_T', '.'];
      let foundMods = '';
      mods.forEach(mod => { if (cleanText.includes(mod)) { foundMods += mod; cleanText = cleanText.replace(mod, ''); } });
      
      const parts = cleanText.split('/');
      const transposedParts = parts.map(part => {
          const match = part.match(/^([a-gA-G][#b♯♭]?)(.*)$/);
          if (!match) return part; 
          let note = match[1]; const rest = match[2];
          note = note.replace(/♯/g, '#').replace(/♭/g, 'b');
          note = note.charAt(0).toUpperCase() + note.slice(1);
          let idx = getNoteIndex(note);
          if (idx === -1) return part; 
          let useFlats = flatKeys.includes(note) && !sharpKeys.includes(note);
          let newIdx = (idx + steps) % 12; if (newIdx < 0) newIdx += 12;
          return (useFlats ? flatKeys[newIdx] : sharpKeys[newIdx]) + rest;
      });
      return transposedParts.join('/') + foundMods;
    };

    const chordToNNS = (chordRaw, songKey) => {
        if (!chordRaw || !songKey) return chordRaw;
        let cleanText = chordRaw;
        const mods = ['_H', '_S', '_T', '.'];
        let foundMods = '';
        mods.forEach(mod => { if (cleanText.includes(mod)) { foundMods += mod; cleanText = cleanText.replace(mod, ''); } });
        
        const keyIdx = getNoteIndex(songKey);
        if (keyIdx === -1) return chordRaw;

        const parts = cleanText.split('/');
        const nnsParts = parts.map(part => {
            const match = part.match(/^([a-gA-G][#b♯♭]?)(.*)$/);
            if (!match) return part;
            let note = match[1]; let rest = match[2];
            note = note.replace(/♯/g, '#').replace(/♭/g, 'b');
            note = note.charAt(0).toUpperCase() + note.slice(1);
            let noteIdx = getNoteIndex(note);
            if (noteIdx === -1) return part;
            
            let interval = (noteIdx - keyIdx + 12) % 12;
            let num = nnsMap[interval] || '?';
            return num + rest;
        });
        return nnsParts.join('/') + foundMods;
    };

    const detectChord = (midiNotes) => {
        if (midiNotes.length === 0) return null;
        const NOTE_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const sortedNotes = [...midiNotes].sort((a, b) => a - b);
        const lowestNote = sortedNotes[0];
        const bassName = NOTE_NAMES[lowestNote % 12];
        const pitchClasses = Array.from(new Set(sortedNotes.map(n => n % 12))).sort((a, b) => a - b);
        
        const chordMap = {
            '0,4,7': '', '0,3,7': 'm', '0,4,7,11': 'ma7', '0,3,7,10': 'm7', '0,4,7,10': '7', '0,3,6': 'dim', '0,4,8': 'aug',
            '0,5,7': 'sus4', '0,2,7': 'sus2', '0,3,6,9': 'dim7', '0,3,6,10': 'm7b5', '0,4,7,9': '6', '0,3,7,9': 'm6',
            '0,2,4,7,10': '9', '0,2,3,7,10': 'm9', '0,2,4,7,11': 'ma9',
            '0,4,10': '7', '0,3,10': 'm7', '0,4,11': 'ma7', '0,2,4,7': 'add9', '0,5,7,10': '7sus4',
            '0,4': '', '0,3': 'm'
        };

        for (let i = 0; i < pitchClasses.length; i++) {
            const root = pitchClasses[i]; const rootName = NOTE_NAMES[root];
            const intervals = pitchClasses.map(pc => (pc - root + 12) % 12).sort((a,b) => a-b);
            const intervalStr = intervals.join(',');
            if (chordMap[intervalStr] !== undefined) {
                const suffix = chordMap[intervalStr];
                if (root === (lowestNote % 12)) return rootName + suffix;
                else return rootName + suffix + '/' + bassName; 
            }
        }
        if (pitchClasses.length === 1) return bassName;
        if (pitchClasses.length === 2) {
            const interval = (pitchClasses[1] - pitchClasses[0] + 12) % 12;
            if (interval === 7) return NOTE_NAMES[pitchClasses[0]] + '5';
            if (interval === 5) return NOTE_NAMES[pitchClasses[1]] + '5';
            if (interval === 4) return NOTE_NAMES[pitchClasses[0]];
            if (interval === 3) return NOTE_NAMES[pitchClasses[0]] + 'm';
        }
        return null;
    };

    const parseSpokenChord = (transcript) => {
        let t = transcript.toLowerCase().trim();
        if (t === 'next' || t === 'skip' || t === 'advance' || t === 'pass' || t === 'space') return 'NEXT';
        
        t = t.replace(/\b(one|1)\b/g, '1').replace(/\b(two|too|to|2)\b/g, '2').replace(/\b(three|tree|3)\b/g, '3')
             .replace(/\b(four|for|4)\b/g, '4').replace(/\b(five|5)\b/g, '5').replace(/\b(six|6)\b/g, '6')
             .replace(/\b(seven|7)\b/g, '7').replace(/\b(eight|8)\b/g, '8').replace(/\b(nine|9)\b/g, '9');
        t = t.replace(/\bsharp\b/g, '#').replace(/\bflat\b/g, 'b');
        t = t.replace(/\bsee\b/g, 'c').replace(/\bsea\b/g, 'c').replace(/\bsi\b/g, 'c').replace(/\bee\b/g, 'e')
             .replace(/\bhe\b/g, 'e').replace(/\bbee\b/g, 'b').replace(/\bbe\b/g, 'b').replace(/\bgee\b/g, 'g')
             .replace(/\baye\b/g, 'a').replace(/\bhey\b/g, 'a').replace(/\bthe\b/g, 'd'); 
        t = t.replace(/\bminor\b/g, 'm').replace(/\bmajor\b/g, 'ma').replace(/\bdiminished\b/g, 'dim')
             .replace(/\baugmented\b/g, 'aug').replace(/\bsus\b/g, 'sus').replace(/\bsuspended\b/g, 'sus').replace(/\badd\b/g, 'add');
        t = t.replace(/\bover\b/g, '/').replace(/\bslash\b/g, '/').replace(/\s+/g, '');

        const match = t.match(/^([a-g][#b]?)(.*)/);
        if (!match) return null;
        let root = match[1].charAt(0).toUpperCase() + match[1].slice(1);
        let rest = match[2];
        if (rest.includes('/')) {
            const parts = rest.split('/');
            if (parts[1] && parts[1].length > 0) rest = parts[0] + '/' + (parts[1].charAt(0).toUpperCase() + parts[1].slice(1));
        }
        return root + rest;
    };

    const getFreshSong = () => ({
      title: 'UNTITLED SONG', titleSize: 52, artist: 'ARTIST NAME', artistSize: 18, sectionTitleSize: 30,
      tempo: '120', timeSignature: '4/4', key: 'C', linesPerPage: 8, barsPerLine: 4, strokes: [],
      sections: [{ id: Date.now(), name: 'Intro', lines: [[
        { leftBar: '|', rightBar: '', slots: [''], timeSignature: '4/4' },
        { leftBar: '|', rightBar: '', slots: [''] },
        { leftBar: '|', rightBar: '', slots: [''] },
        { leftBar: '|', rightBar: '|', slots: [''] }
      ]] }]
    });

    const getDemoSong = () => ({
      title: 'STAND BY ME (DEMO)', titleSize: 52, artist: 'BEN E. KING', artistSize: 18, sectionTitleSize: 30,
      tempo: '118', timeSignature: '4/4', key: 'A', linesPerPage: 8, barsPerLine: 4, strokes: [],
      sections: [{ id: Date.now(), name: 'Verse', lines: [
        [
          { leftBar: '|:', rightBar: '', slots: ['A'], timeSignature: '4/4' },
          { leftBar: '|', rightBar: '', slots: ['A'] },
          { leftBar: '|', rightBar: '', slots: ['F#m'] },

        [
          { leftBar: '|', rightBar: '', slots: ['D'] },
          { leftBar: '|', rightBar: '', slots: ['E'] },

    const PAGE_HEIGHT = 1131;
    const isCloudAvailable = typeof window.firebaseModules !== 'undefined';
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'chord-chart-studio-direct';

    function ChordChartEditor() {
      const APP_VERSION = "7.2.4";

      // 1. App State
      const [songState, setSongState] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('session')) return { past: [], present: getFreshSong(), future: [] };

        try {
          const saved = localStorage.getItem('chordChartV7_2') || sessionStorage.getItem('chordChartV7_2');
          if (saved) { 
              const parsed = JSON.parse(saved); 
              if (parsed && Array.isArray(parsed.sections)) return { past: [], present: { ...parsed, strokes: parsed.strokes || [], linesPerPage: parsed.linesPerPage || 8, barsPerLine: parsed.barsPerLine || 4, sectionTitleSize: parsed.sectionTitleSize || 30 }, future: [] }; 
          }
        } catch (e) {}
        return { past: [], present: getFreshSong(), future: [] };
      });
      const song = songState.present;
      const songRef = useRef(song);
      useEffect(() => { songRef.current = song; }, [song]);

      // 2. UI Toggles & Tools State
      const [activeBarInfo, setActiveBarInfo] = useState(null); 
      const activeBarInfoRef = useRef(null);
      useEffect(() => { activeBarInfoRef.current = activeBarInfo; }, [activeBarInfo]);
      
      const [editingBarProps, setEditingBarProps] = useState(null);
      const [showTools, setShowTools] = useState(() => typeof window !== 'undefined' ? window.innerWidth >= 1024 : true);
      const [showSettings, setShowSettings] = useState(false);
      const [showAbout, setShowAbout] = useState(false);
      const [showPagesModal, setShowPagesModal] = useState(false);
      
      const [stylusMode, setStylusMode] = useState(false); 
      const [freehandMode, setFreehandMode] = useState(false); 
      const [penSize, setPenSize] = useState(3);
      const [penColor, setPenColor] = useState('#000000');

      const [midiEnabled, setMidiEnabled] = useState(false);
      const [midiStatus, setMidiStatus] = useState('MIDI Off');
      const [midiNoteValue, setMidiNoteValue] = useState(1); // 1 = Whole Bar, 2 = Half Note, 4 = Quarter Note / Beat, 8 = 8th
      const [showSaveDropdown, setShowSaveDropdown] = useState(false);
      const saveDropdownRef = useRef(null);

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (saveDropdownRef.current && !saveDropdownRef.current.contains(e.target)) {
            setShowSaveDropdown(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const [voiceEnabled, setVoiceEnabled] = useState(false);
      const [voiceStatus, setVoiceStatus] = useState('Voice Off');
      const voiceEnabledRef = useRef(false);
      useEffect(() => { voiceEnabledRef.current = voiceEnabled; }, [voiceEnabled]);

      const [dialog, setDialog] = useState(null);
      const [isExporting, setIsExporting] = useState(false);
      const [scale, setScale] = useState(1);
      const [zoomMode, setZoomMode] = useState('width');  

      // 3. Version Specific Features State
      const [capo, setCapo] = useState(0);
      const [displayMode, setDisplayMode] = useState('standard'); 
      const [simplifyMode, setSimplifyMode] = useState(false);
      const [isGigMode, setIsGigMode] = useState(false);
      const [gigTheme, setGigTheme] = useState(() => {
        try {
          return localStorage.getItem('ccs_gig_theme') || 'light';
        } catch(e) {
          return 'light';
        }
      });
      const [gigFitMode, setGigFitMode] = useState('fit'); // 'fit' or 'width'
      const [gigControlsVisible, setGigControlsVisible] = useState(true);
      const gigControlsTimerRef = useRef(null);
      const [currentGigPageIndex, setCurrentGigPageIndex] = useState(0);

      // On-Screen Keyboard State
      const [showChordKeyboard, setShowChordKeyboard] = useState(false);
      const [keyboardAccidentals, setKeyboardAccidentals] = useState('sharps'); // 'sharps' or 'flats'
      const [keypadAutoAdvance, setKeypadAutoAdvance] = useState(true);

      // Keypad Configurable Delay Auto-Jump State (1s, 2s, 3s)
      const [keypadAutoJumpDelay, setKeypadAutoJumpDelay] = useState(() => {
        try {
          const s = localStorage.getItem('ccs_keypad_auto_jump_delay');
          if (s) {
            const num = Number(s);
            if (num === 1 || num === 2 || num === 3) return num;
          }
        } catch (e) {}
        return 1;
      });

      const changeKeypadAutoJumpDelay = useCallback((sec) => {
        const val = Math.max(1, Math.min(3, Number(sec) || 1));
        setKeypadAutoJumpDelay(val);
        try { localStorage.setItem('ccs_keypad_auto_jump_delay', val.toString()); } catch (e) {}
        showToast(`Auto Jump delay set to ${val}s`);
      }, [showToast]);

      const keypadJumpTimerRef = useRef(null);
      const [keypadPendingJump, setKeypadPendingJump] = useState(false);
      const [keypadCountdown, setKeypadCountdown] = useState(1.0);
      const keypadCountdownIntervalRef = useRef(null);
      const keypadActiveBarTargetRef = useRef(null);

      useEffect(() => {
        return () => {
          if (keypadJumpTimerRef.current) clearTimeout(keypadJumpTimerRef.current);
          if (keypadCountdownIntervalRef.current) clearInterval(keypadCountdownIntervalRef.current);
        };
      }, []);

      // Top Panel Responsive & Focus Modes (Item 1)
      const [focusMode, setFocusMode] = useState(false);
      const [showAllToolsModal, setShowAllToolsModal] = useState(false);
      const ribbonScrollRef = useRef(null);
      const scrollRibbon = (offset) => {
        if (ribbonScrollRef.current) {
          ribbonScrollRef.current.scrollBy({ left: offset, behavior: 'smooth' });
        }
      };
      const [showSetlistModal, setShowSetlistModal] = useState(false);
      const [showImportModal, setShowImportModal] = useState(false);
      const [importText, setImportText] = useState("");
      
      // Toast Notification State
      const [toastMessage, setToastMessage] = useState(null);
      const toastTimerRef = useRef(null);
      const showToast = useCallback((msg) => {
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);

              } else if (mode === 'insert-after') {

              } else if (mode === 'insert-before') {

          const newBarIdx = barIdx + dir;
          if (newBarIdx < 0 || newBarIdx >= line.length) return prev;
          
          const temp = line[barIdx];
          line[barIdx] = line[newBarIdx];
          line[newBarIdx] = temp;
          
          line.forEach((b, i) => { b.rightBar = (i === line.length - 1) ? '|' : (b.rightBar === ':|' ? ':|' : ''); });
          
          const newLines = [...sec.lines];
          newLines[lineIdx] = line;

          newSecs[sIdx] = { ...sec, lines: newLines };
          return { ...prev, sections: newSecs };

            })
          };
        });
        showToast("Line cut to clipboard");
      }, [copyLine, showToast]);

      const pasteLine = useCallback((secId, lineIdx, mode = 'after') => {
        if (!lineClipboard) {
          showToast("No line in clipboard to paste");

        }
        setSong(prev => {
          return {
            ...prev,
            sections: prev.sections.map(s => {
              if (s.id !== secId) return s;
              const newLines = [...s.lines];
              const pasted = JSON.parse(JSON.stringify(lineClipboard));
              const insertIdx = mode === 'before' ? lineIdx : lineIdx + 1;

      const moveLine = useCallback((secId, lineIdx, dir) => {
        setSong(prev => {
          const sIdx = prev.sections.findIndex(s => s.id === secId);

          const newIdx = lineIdx + dir;
          if (newIdx < 0 || newIdx >= sec.lines.length) return prev;
          
          const newLines = [...sec.lines];
          const temp = newLines[lineIdx];
          newLines[lineIdx] = newLines[newIdx];
          newLines[newIdx] = temp;
          
          const newSecs = [...prev.sections];
          newSecs[sIdx] = { ...sec, lines: newLines };

      }, [showToast]);

      // 5. Navigation between Bars and Lines (with Auto-Line Creation at Last Bar - Items 5 & 6)
      const advanceToNextBar = useCallback((targetInfo = activeBarInfoRef.current) => {
        if (isReadOnly) return;
        const currentSong = songRef.current;
        let info = targetInfo || activeBarInfoRef.current;
        if (!info) {
          if (currentSong.sections.length > 0 && currentSong.sections[0].lines.length > 0) {
            info = { secId: currentSong.sections[0].id, lineIdx: 0, barIdx: 0, slotIdx: 0 };
            setActiveBarInfo(info);
            activeBarInfoRef.current = info;
          }
          return;
        }

        const { secId, lineIdx, barIdx } = info;
        const sIdx = currentSong.sections.findIndex(s => s.id === secId);
        if (sIdx === -1) return;
        const sec = currentSong.sections[sIdx];
        const line = sec.lines[lineIdx];
        if (!line) return;

        // If not at the last bar of the line, jump to the next bar on this line
        if (barIdx < line.length - 1) {
          const nextInfo = { secId, lineIdx, barIdx: barIdx + 1, slotIdx: 0 };
          setActiveBarInfo(nextInfo);
          activeBarInfoRef.current = nextInfo;
          return;
        }

        // We are at the last bar on the line (barIdx === line.length - 1)!
        // If there is already a subsequent line in this section, jump to its first bar:
        if (lineIdx < sec.lines.length - 1) {
          const nextInfo = { secId, lineIdx: lineIdx + 1, barIdx: 0, slotIdx: 0 };
          setActiveBarInfo(nextInfo);
          activeBarInfoRef.current = nextInfo;
          return;
        }

        // At the last bar on the line of the section: automatically create next line as per preference!
        const preferredBars = currentSong.barsPerLine || (line.length > 0 ? line.length : 4);
        const newLine = Array(preferredBars).fill(null).map((_, i) => ({
          leftBar: '|',
          rightBar: i === preferredBars - 1 ? '|' : '',
          slots: ['']
        }));

        setSong(prev => ({
          ...prev,
          sections: prev.sections.map(s => {
            if (s.id !== secId) return s;
            return { ...s, lines: [...s.lines, newLine] };
          })
        }));

        const nextInfo = { secId, lineIdx: lineIdx + 1, barIdx: 0, slotIdx: 0 };
        setActiveBarInfo(nextInfo);
        activeBarInfoRef.current = nextInfo;
        showToast(`Created next line (${preferredBars} bars)`);
      }, [isReadOnly, showToast, setSong]);

      // Keypad Configurable Delay Auto-Jump System (1s, 2s, 3s)
      const clearKeypadJumpTimer = useCallback(() => {
        if (keypadJumpTimerRef.current) {

        }

      const triggerKeypadJumpNow = useCallback(() => {

      const scheduleKeypadAutoJump = useCallback((targetInfo) => {

        }
        if (keypadCountdownIntervalRef.current) {
          clearInterval(keypadCountdownIntervalRef.current);

        keypadActiveBarTargetRef.current = target;

        const duration = delaySeconds * 1000;

          const elapsed = Date.now() - startTime;
          const remaining = Math.max(0, (duration - elapsed) / 1000);

      const navigateSlot = useCallback((dir) => {

      const navigateLine = useCallback((dir) => {

      // Focus active chord input whenever activeBarInfo changes
      useEffect(() => {

      const setSong = useCallback((newSongOrUpdater) => {

      const undo = useCallback(() => {

      const redo = useCallback(() => {
        if (isReadOnly) return;

          if (prevState.future.length === 0) return prevState;

      // Global Keydown Handler (Undo, Redo, Copy/Cut/Paste, Bar/Line navigation)
      useEffect(() => {
        const handleGlobalKeyDown = (e) => {
          if (isReadOnly) return;
          const isTyping = document.activeElement?.tagName === 'INPUT' || document.activeElement?.tagName === 'TEXTAREA';
          
          const isUndo = ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey);
          const isRedo = ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)));

          if (isUndo) {
            e.preventDefault();
            undo();
            return;
          } else if (isRedo) {
            e.preventDefault();
            redo();
            return;
          }

          // Shortcuts for active bar / line
          if (activeBarInfo) {
            const { secId, lineIdx, barIdx } = activeBarInfo;
            // Alt + Arrow Left/Right: Move Bar
            if (e.altKey && e.key === 'ArrowLeft') {
              e.preventDefault();
              moveBar(secId, lineIdx, barIdx, -1);
              return;
            }
            if (e.altKey && e.key === 'ArrowRight') {
              e.preventDefault();
              moveBar(secId, lineIdx, barIdx, 1);
              return;
            }
            // Alt + Arrow Up/Down: Move Line
            if (e.altKey && e.key === 'ArrowUp') {
              e.preventDefault();
              moveLine(secId, lineIdx, -1);
              return;
            }
            if (e.altKey && e.key === 'ArrowDown') {
              e.preventDefault();
              moveLine(secId, lineIdx, 1);
              return;
            }

            // Ctrl/Cmd + C/X/V when not selecting text inside an input
            const hasTextSelection = window.getSelection && window.getSelection().toString().length > 0;
            if ((e.ctrlKey || e.metaKey) && !hasTextSelection) {
              if (e.key.toLowerCase() === 'c') {
                e.preventDefault();
                copyBar(secId, lineIdx, barIdx);
              } else if (e.key.toLowerCase() === 'x') {
                e.preventDefault();
                cutBar(secId, lineIdx, barIdx);
              } else if (e.key.toLowerCase() === 'v') {
                e.preventDefault();
                pasteBar(secId, lineIdx, barIdx, 'replace');
              }
            }
          }
        };
        window.addEventListener('keydown', handleGlobalKeyDown);
        return () => window.removeEventListener('keydown', handleGlobalKeyDown);
      }, [undo, redo, isReadOnly, activeBarInfo, copyBar, cutBar, pasteBar, moveBar, moveLine]);

      const resetSheet = () => {
        setDialog({ 
          type: 'confirm', message: "Are you sure you want to start a new sheet? All unsaved progress will be lost.",
          onConfirm: () => { setSongState({ past: [], present: { ...getFreshSong(), id: Date.now() }, future: [] }); setActiveBarInfo(null); setEditingBarProps(null); }
        });
      };

      const saveJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(song, null, 2));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `${(song.title || 'CHORD_SHEET').replace(/\s+/g, '_')}.json`);
        document.body.appendChild(dlAnchorElem);
        dlAnchorElem.click();
        dlAnchorElem.remove();
      };

      const loadJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed && Array.isArray(parsed.sections)) {

                past: [],
                present: {
                  ...getFreshSong(),
                  ...parsed,
                  strokes: parsed.strokes || [],
                  linesPerPage: parsed.linesPerPage || 8,
                  sectionTitleSize: parsed.sectionTitleSize || 30
                },
                future: []
              });
              setActiveBarInfo(null);
              setEditingBarProps(null);
              setDialog({ type: 'alert', message: "Song loaded successfully!" });
            } else {
              setDialog({ type: 'alert', message: "Invalid File Format. Please upload a valid Chord Sheet JSON." });
            }
          } catch (error) {
            setDialog({ type: 'alert', message: "Invalid File Format. Please upload a valid Chord Sheet JSON." });
          }
        };
        reader.readAsText(file);
        e.target.value = ''; 
      };

      const exportJPG = async () => {
        if (!window.html2canvas) return setDialog({ type: 'alert', message: "Export library is still loading, try again in a few seconds." });
        setIsExporting(true);
        setTimeout(async () => {
          try {
            const pageElements = document.querySelectorAll('.a4-page-export');
            const canvases = []; let totalHeight = 0; let maxWidth = 0;
            for (let i = 0; i < pageElements.length; i++) {
                const canvas = await window.html2canvas(pageElements[i], { scale: 2, backgroundColor: '#ffffff' });
                canvases.push(canvas); totalHeight += canvas.height; if (canvas.width > maxWidth) maxWidth = canvas.width;
            }

            const ctx = stitched.getContext('2d'); let yOffset = 0;
            for (let canvas of canvases) { ctx.drawImage(canvas, 0, yOffset); yOffset += canvas.height; }
            const link = document.createElement('a');

            setDialog({ type: 'alert', message: "Failed to export JPG. Please try again." });
          } finally {
            setIsExporting(false);
          }
        }, 400);
      };

      const exportPDF = () => {
        const jsPdfClass = window.jspdf?.jsPDF || window.jsPDF;
        const html2canvasFn = window.html2canvas;
        if (!jsPdfClass || !html2canvasFn) {
          return setDialog({ type: 'alert', message: "Export library is still loading, try again in a few seconds." });
        }

        setTimeout(async () => {
          try {

            const pageElements = document.querySelectorAll('.a4-page-export');

            }

          } finally {
            setIsExporting(false);

      };

      const togglePageBreak = (secId, lineIdx) => {

          ...prev,
          sections: prev.sections.map(s => {
            if (s.id !== secId) return s;

      const handleGlobalTranspose = (steps) => {

      const moveToNextSlot = useCallback(() => {

      const updateChord = useCallback((secId, lineIdx, barIdx, slotIdx, value) => {

      const getRelativeCoords = useCallback((e) => {
          const canvas = drawingCanvasRef.current;

          else if (song.linesPerPage === 16) lineCost = 50;
        }

        addNodeToPage({ type: 'header' }, 160);
        song.sections.forEach((section, secIdx) => {
            const forceBreak = section.lines.length > 0 && section.lines[0][0]?.pageBreak;
            if ((forceBreak || (currentPage.height + 45 + (section.lines.length > 0 ? lineCost : 30) > MAX_PAGE_HEIGHT)) && currentPage.items.length > 0) {
                pages.push(currentPage); 
                currentPage = { items: [], height: 0, sectionMap: {} };
            }
            addNodeToPage({ type: 'section-header', section, secIdx }, 45);
            section.lines.forEach((line, lineIdx) => {
                if (lineIdx > 0 && line[0]?.pageBreak && currentPage.items.length > 0) { 
                  pages.push(currentPage); 
                  currentPage = { items: [], height: 0, sectionMap: {} }; 
                }
                addNodeToPage({ type: 'line', section, secIdx, line, lineIdx, startingBarNumber: globalBarCount }, lineCost);
                globalBarCount += line.length;
            });
            if (!isGigMode) addNodeToPage({ type: 'add-line', section, secIdx }, 30);
        });
        if (!isGigMode) addNodeToPage({ type: 'add-section' }, 55);
        if (currentPage.items.length > 0) pages.push(currentPage);
        return pages;
      };

      const pagesArray = generatePages();
      const PAGE_GAP = 32; 
      const totalCanvasHeight = pagesArray.length * PAGE_HEIGHT + (pagesArray.length > 0 ? (pagesArray.length - 1) * PAGE_GAP : 0);

      // Page Management Operations (Item 6)
      const addPage = () => {
        setSong(prev => {
          const newSecId = Date.now();
          const newSecName = `Section ${prev.sections.length + 1}`;
          const newLine = Array(4).fill(null).map((_, i) => ({
            leftBar: '|',
            rightBar: i === 3 ? '|' : '',
            slots: [''],
            pageBreak: i === 0
          }));
          return {
            ...prev,
            sections: [
              ...prev.sections,
              { id: newSecId, name: newSecName, lines: [newLine] }
            ]
          };
        });
        showToast("New page added");
      };

      const removePage = (pageIndex) => {
        if (pagesArray.length <= 1) {
          showToast("Cannot remove the only page");
          return;
        }
        const page = pagesArray[pageIndex];
        if (!page) return;
        const secIds = Object.keys(page.sectionMap).map(Number);
        
        setDialog({
          type: 'confirm',
          message: `Are you sure you want to remove Page ${pageIndex + 1}?\n\nThis will remove the sections on this page (${Object.values(page.sectionMap).map(s => s.name).join(', ')}).`,
          onConfirm: () => {
            setSong(prev => {
              const newSecs = prev.sections.filter(s => !secIds.includes(s.id));
              return { ...prev, sections: newSecs.length > 0 ? newSecs : getFreshSong().sections };
            });
            showToast(`Page ${pageIndex + 1} removed`);
          }
        });
      };

      const movePage = (pageIndex, dir) => {
        const targetPageIndex = pageIndex + dir;
        if (targetPageIndex < 0 || targetPageIndex >= pagesArray.length) return;
        
        const sourcePage = pagesArray[pageIndex];
        const targetPage = pagesArray[targetPageIndex];
        if (!sourcePage || !targetPage) return;

        const sourceSecIds = Object.keys(sourcePage.sectionMap).map(Number);
        const targetSecIds = Object.keys(targetPage.sectionMap).map(Number);

        setSong(prev => {
          const newSections = [...prev.sections];
          const sourceIndices = sourceSecIds.map(id => newSections.findIndex(s => s.id === id)).filter(i => i !== -1);
          const targetIndices = targetSecIds.map(id => newSections.findIndex(s => s.id === id)).filter(i => i !== -1);
          
          if (sourceIndices.length > 0 && targetIndices.length > 0) {
            const extractedSource = sourceIndices.sort((a,b)=>a-b).map(i => newSections[i]);
            const remaining = newSections.filter(s => !sourceSecIds.includes(s.id));
            
            const targetFirstId = targetPage.items.find(it => it.section)?.section?.id;
            let insertIdx = remaining.findIndex(s => s.id === targetFirstId);
            if (insertIdx === -1) insertIdx = 0;
            
            if (dir > 0) {
              const targetLastId = targetSecIds[targetSecIds.length - 1];
              const lastIdx = remaining.findIndex(s => s.id === targetLastId);
              insertIdx = lastIdx !== -1 ? lastIdx + 1 : remaining.length;
            }
            
            remaining.splice(insertIdx, 0, ...extractedSource);
            
            if (remaining[insertIdx]?.lines?.[0]?.[0]) {
              remaining[insertIdx].lines[0][0].pageBreak = true;
            }
            return { ...prev, sections: remaining };
          }
          return prev;
        });
        showToast(dir < 0 ? `Moved Page ${pageIndex + 1} Up` : `Moved Page ${pageIndex + 1} Down`);
      };

      const scrollToPage = (pageIndex) => {
        if (!containerRef.current) return;
        const pageY = pageIndex * (PAGE_HEIGHT + PAGE_GAP) * scale;
        containerRef.current.scrollTo({ top: pageY, behavior: 'smooth' });
        setCurrentGigPageIndex(pageIndex);
        setShowPagesModal(false);
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
          setIsFullscreen(true);
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
          setIsFullscreen(false);
        }
      };

      // Render Bar and Line
      const renderLine = (section, secIdx, line, lineIdx, startingBarNumber) => {
        let lineContainerClass = 'h-[75px]'; let inputFontSizeClass = 'text-2xl'; let slotFontSizeClass = 'text-xl';
        
        if (stylusMode && !freehandMode) { 
            lineContainerClass = 'h-[120px]'; inputFontSizeClass = 'text-3xl border-2 border-dashed border-gray-300 bg-white shadow-inner m-1 rounded-md'; slotFontSizeClass = 'text-2xl'; 
        } else {
          if (song.linesPerPage === 12) { lineContainerClass = 'h-[55px]'; inputFontSizeClass = 'text-xl'; slotFontSizeClass = 'text-lg'; }
          if (song.linesPerPage === 16) { lineContainerClass = 'h-[40px]'; inputFontSizeClass = 'text-lg'; slotFontSizeClass = 'text-base'; }
        }

        const isLineActive = activeBarInfo?.secId === section.id && activeBarInfo?.lineIdx === lineIdx;

        return (
          <div className={`flex w-full relative group/line border-y transition-colors shrink-0 mb-3 z-10 ${isLineActive && !isGigMode ? 'border-blue-400 bg-blue-50/20' : 'border-transparent hover:border-gray-200'} ${lineContainerClass}`}>
            {line[0]?.pageBreak && lineIdx > 0 && !isGigMode && (
              <div className="absolute -top-3 left-0 right-0 border-t-2 border-dashed border-blue-400 opacity-60 z-20 pointer-events-none flex justify-center no-print">
                <span className="bg-white text-blue-600 text-[9px] font-black px-2 py-0.5 rounded-full -mt-2 uppercase tracking-widest border border-blue-300 shadow-sm flex items-center gap-1">
                  <Icons.FileText size={10} /> Page Break
                </span>
              </div>
            )}
            
            {line.map((bar, barIdx) => {
              const isBarActive = activeBarInfo?.secId === section.id && activeBarInfo?.lineIdx === lineIdx && activeBarInfo?.barIdx === barIdx;

              return (
                <div key={barIdx} className={`flex-1 relative flex flex-col h-full group/bar bg-transparent ${isGigMode ? (gigTheme === 'dark' ? 'border-gray-600' : 'border-black') : 'border-black'} cursor-text transition-all ${(stylusMode && !freehandMode) ? 'p-1' : ''} ${isBarActive && !isGigMode ? 'ring-2 ring-blue-500 ring-offset-1 bg-blue-50/30 rounded-sm' : ''}`}
                  onClick={(e) => { e.stopPropagation(); if(!isGigMode && (!stylusMode || !freehandMode)) setActiveBarInfo({ secId: section.id, lineIdx, barIdx, slotIdx: 0 }); }}
                  onDoubleClick={(e) => { if (!isGigMode && (!stylusMode || !freehandMode)) { e.stopPropagation(); setEditingBarProps({ secId: section.id, lineIdx, barIdx, data: bar }); } }}
                  onContextMenu={(e) => { if (!isGigMode && (!stylusMode || !freehandMode)) { e.preventDefault(); e.stopPropagation(); setEditingBarProps({ secId: section.id, lineIdx, barIdx, data: bar }); } }}
                  style={{ borderLeftStyle: bar.leftBar === '||' || bar.leftBar === '|:' ? 'double' : 'solid', borderLeftWidth: bar.leftBar ? (bar.leftBar === '||' || bar.leftBar === '|:' ? '6px' : '2px') : '0', borderRightStyle: bar.rightBar === '||' || bar.rightBar === ':|' ? 'double' : 'solid', borderRightWidth: bar.rightBar ? (bar.rightBar === '||' || bar.rightBar === ':|' ? '6px' : '2px') : '0', marginLeft: bar.leftBar ? '-2px' : '0' }}
                >
                  {bar.topText && (
                      <div className={`absolute -top-4 left-0 font-bold text-[11px] px-1 z-20 ${isGigMode ? (gigTheme === 'dark' ? 'bg-black text-gray-300' : 'bg-white text-gray-600') : 'bg-white text-gray-600'}`}>
                          {bar.topText}
                      </div>
                  )}
                  
                  {bar.repeatCount && bar.rightBar === ':|' && (
                      <div className={`absolute -top-[22px] right-0 font-black text-lg px-1 z-20 ${isGigMode ? (gigTheme === 'dark' ? 'bg-black text-blue-400' : 'bg-white text-blue-600') : 'bg-white text-blue-600'}`}>
                          {bar.repeatCount}
                      </div>
                  )}

                  {bar.leftBar === '|:' && <div className="absolute left-1.5 top-1/2 -translate-y-1/2 font-serif text-2xl font-black z-10 pointer-events-none">:</div>}
                  {bar.rightBar === ':|' && <div className="absolute right-1.5 top-1/2 -translate-y-1/2 font-serif text-2xl font-black z-10 pointer-events-none">:</div>}
                  
                  {bar.timeSignature && <div onClick={(e) => { if(!isGigMode){ e.stopPropagation(); setEditingBarProps({ secId: section.id, lineIdx, barIdx, data: bar }); } }} className={`absolute -left-6 md:-left-8 top-1/2 -translate-y-1/2 flex flex-col items-center justify-center z-20 font-serif font-black text-xl md:text-2xl leading-[0.8] cursor-pointer hover:scale-110 transition-transform select-none ${isGigMode ? (gigTheme === 'dark' ? 'text-white bg-black' : 'text-black bg-white') : 'text-black bg-white'} px-0.5 rounded shadow-sm hover:shadow-md`}><span>{bar.timeSignature.split('/')[0] || ''}</span><span>{bar.timeSignature.split('/')[1] || ''}</span></div>}
                  {barIdx === 0 && startingBarNumber && <div className={`absolute -bottom-4 left-0 text-[10px] font-bold ${isGigMode ? (gigTheme === 'dark' ? 'text-gray-600' : 'text-gray-400') : 'text-gray-400'} z-10 pointer-events-none select-none ${(stylusMode && !freehandMode) ? 'ml-2' : ''}`}>{startingBarNumber}</div>}
                  
                  {/* Floating Action Bar for Active Bar */}
                  {isBarActive && !isGigMode && (!stylusMode || !freehandMode) && (
                    <div className="no-print absolute -top-7 left-1/2 -translate-x-1/2 bg-black text-white px-2 py-0.5 rounded shadow-lg flex items-center gap-1 z-30 text-[10px] uppercase font-bold tracking-wider pointer-events-auto">
                      <span className="text-gray-300 mr-1">Bar</span>
                      <button onClick={(e) => { e.stopPropagation(); moveBar(section.id, lineIdx, barIdx, -1); }} disabled={barIdx === 0} className="hover:text-blue-400 p-0.5 disabled:opacity-30" title="Move Bar Left"><Icons.ArrowLeft size={10} /></button>
                      <button onClick={(e) => { e.stopPropagation(); moveBar(section.id, lineIdx, barIdx, 1); }} disabled={barIdx === line.length - 1} className="hover:text-blue-400 p-0.5 disabled:opacity-30" title="Move Bar Right"><Icons.ArrowRight size={10} /></button>
                      <div className="w-px h-2.5 bg-gray-600 mx-0.5"></div>
                      <button onClick={(e) => { e.stopPropagation(); copyBar(section.id, lineIdx, barIdx); }} className="hover:text-blue-400 p-0.5" title="Copy Bar"><Icons.Copy size={10} /></button>
                      <button onClick={(e) => { e.stopPropagation(); cutBar(section.id, lineIdx, barIdx); }} className="hover:text-red-400 p-0.5" title="Cut Bar"><Icons.Scissors size={10} /></button>
                      {barClipboard && <button onClick={(e) => { e.stopPropagation(); pasteBar(section.id, lineIdx, barIdx, 'replace'); }} className="hover:text-green-400 p-0.5" title="Paste Bar Over"><Icons.Paste size={10} /></button>}
                      <div className="w-px h-2.5 bg-gray-600 mx-0.5"></div>
                      <button onClick={(e) => { e.stopPropagation(); setEditingBarProps({ secId: section.id, lineIdx, barIdx, data: bar }); }} className="hover:text-yellow-400 p-0.5" title="Bar Properties"><Icons.Settings size={10} /></button>
                    </div>
                  )}

                  <div className="flex w-full h-full gap-1">
                    {bar.slots.map((slot, slotIdx) => {
                      const placeholderText = isExporting || isGigMode ? "" : ((stylusMode && !freehandMode) ? "Write..." : (bar.slots.length === 1 ? 'W' : bar.slots.length === 2 ? 'H' : bar.slots.length === 4 ? 'Q' : 'E'));
                      const isSlotActive = isBarActive && activeBarInfo?.slotIdx === slotIdx;

                      return (
                        <div key={slotIdx} className={`flex-1 relative h-full flex items-center group/slot border-r border-transparent hover:border-gray-200 ${(stylusMode && !freehandMode) ? 'border-none' : ''} ${isSlotActive && !isGigMode ? 'bg-blue-100/50' : ''}`}>
                          <div className={`absolute inset-0 flex items-center justify-start pl-4 pointer-events-none ${slot ? 'opacity-100' : 'opacity-0'} group-focus-within:opacity-0 transition-opacity`}>
                            {formatAndRenderChord(slot, bar.slots.length, (stylusMode && !freehandMode) ? 8 : song.linesPerPage)}
                          </div>
                          <input id={`input-${section.id}-${lineIdx}-${barIdx}-${slotIdx}`} type="text" inputMode={(stylusMode && !freehandMode) || showChordKeyboard ? "none" : "search"} autoCapitalize="characters" spellCheck="false" autoComplete="off" value={slot}
                            onChange={(e) => updateChord(section.id, lineIdx, barIdx, slotIdx, e.target.value)} 
                            onKeyDown={(e) => handleInputKeyDown(e, section.id, lineIdx, barIdx, slotIdx)}
                            onBlur={(e) => {
                               let val = e.target.value.trim().toUpperCase();
                               if (val.endsWith('H') && !val.includes('_H')) updateChord(section.id, lineIdx, barIdx, slotIdx, val.slice(0,-1).replace('_S','')+'_H');
                               else if (val.endsWith('S') && !val.endsWith('SUS') && !val.includes('_S')) updateChord(section.id, lineIdx, barIdx, slotIdx, val.slice(0,-1).replace('_H','')+'_S');
                               else if (val.endsWith('T') && !val.endsWith('ALT') && !val.includes('_T')) updateChord(section.id, lineIdx, barIdx, slotIdx, val.slice(0,-1)+'_T');
                               else updateChord(section.id, lineIdx, barIdx, slotIdx, e.target.value.trim());
                            }}
                            onFocus={() => { if(!isGigMode && !isReadOnly) setActiveBarInfo({ secId: section.id, lineIdx, barIdx, slotIdx }); }}
                            className={`chord-input w-full h-full text-left pl-4 outline-none ${(!stylusMode || freehandMode) ? 'bg-transparent' : ''} ${slot ? `opacity-0 focus:opacity-100 ${slotFontSizeClass}` : `opacity-100 ${inputFontSizeClass}`} z-10 transition-opacity placeholder-gray-200 focus:bg-gray-50 font-bold`}
                            placeholder={placeholderText} readOnly={isReadOnly || isGigMode}
                            style={{ pointerEvents: (stylusMode && freehandMode) ? 'none' : 'auto' }}
                          />
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}

            {/* Line Actions Menu (Move, Copy, Cut, Paste, Bars, Split, Delete) */}
            {!isGigMode && !isReadOnly && (
                <div className={`no-print absolute -right-12 sm:-right-16 top-1/2 -translate-y-1/2 flex flex-col gap-1 z-30 transition-opacity ${isLineActive ? 'opacity-100' : 'opacity-0 md:group-hover/line:opacity-100'}`}>
                  <div className="flex flex-col bg-white border border-gray-300 rounded shadow-sm p-0.5 gap-0.5">
                    <button onClick={() => moveLine(section.id, lineIdx, -1)} disabled={lineIdx === 0} className="hover:bg-black hover:text-white p-1 rounded text-gray-700 disabled:opacity-20 transition-colors" title="Move Line Up"><Icons.ArrowUp size={11} /></button>
                    <button onClick={() => moveLine(section.id, lineIdx, 1)} disabled={lineIdx === section.lines.length - 1} className="hover:bg-black hover:text-white p-1 rounded text-gray-700 disabled:opacity-20 transition-colors" title="Move Line Down"><Icons.ArrowDown size={11} /></button>
                  </div>

                  <div className="flex flex-col bg-white border border-gray-300 rounded shadow-sm p-0.5 gap-0.5 mt-0.5">
                    <button onClick={() => copyLine(section.id, lineIdx)} className="hover:bg-black hover:text-white p-1 rounded text-gray-700 transition-colors" title="Copy Line"><Icons.Copy size={11} /></button>
                    <button onClick={() => cutLine(section.id, lineIdx)} className="hover:bg-red-500 hover:text-white p-1 rounded text-gray-700 transition-colors" title="Cut Line"><Icons.Scissors size={11} /></button>
                    {lineClipboard && (
                      <button onClick={() => pasteLine(section.id, lineIdx, 'after')} className="hover:bg-green-600 hover:text-white p-1 rounded text-green-700 transition-colors" title="Paste Line Below"><Icons.Paste size={11} /></button>
                    )}
                  </div>

                  <div className="flex flex-col bg-white border border-gray-300 rounded shadow-sm p-0.5 gap-0.5 mt-0.5">
                    <button onClick={() => setSong(p=>({...p, sections: p.sections.map(s=>s.id===section.id?{...s, lines: s.lines.map((l,i)=>i===lineIdx?[...l, {leftBar:'|', rightBar:'|', slots:['']}]:l)}:s)}))} className="hover:bg-black hover:text-white p-1 rounded text-gray-700 transition-colors" title="Add Bar"><Icons.Plus size={11} /></button>
                    <button onClick={() => setSong(p=>({...p, sections: p.sections.map(s=>s.id===section.id?{...s, lines: s.lines.map((l,i)=>i===lineIdx?l.slice(0,-1):l)}:s)}))} className="hover:bg-red-500 hover:text-white p-1 rounded text-gray-700 disabled:opacity-20 transition-colors" disabled={line.length <= 1} title="Remove Bar"><Icons.Minus size={11} /></button>
                    {lineIdx > 0 && (
                      <button onClick={() => togglePageBreak(section.id, lineIdx)} className={`p-1 rounded transition-colors ${line[0]?.pageBreak ? 'bg-blue-600 text-white' : 'hover:bg-black hover:text-white text-gray-700'}`} title={line[0]?.pageBreak ? "Remove Page Break" : "Insert Page Break Above"}>
                        <Icons.Split size={11} />
                      </button>
                    )}
                    <button onClick={() => setSong(p=>({...p, sections: p.sections.map(s=>s.id===section.id?{...s, lines: s.lines.filter((_, idx) => idx !== lineIdx)}:s)}))} className="hover:bg-red-600 hover:text-white text-red-500 p-1 rounded transition-colors" title="Delete Entire Line"><Icons.Trash size={11} /></button>
                  </div>
                </div>
            )}
          </div>
        );
      };

      return (
        <div className={`h-screen flex flex-col font-sans selection:bg-gray-300 overflow-hidden ${isExporting ? 'is-exporting' : ''} ${isGigMode ? `gig-mode ${gigTheme === 'dark' ? 'gig-mode-dark bg-black text-white' : 'gig-mode-light bg-gray-100 text-black'}` : 'bg-gray-200 text-black'}`}>
          
          {/* Main Top Header */}
          {!isGigMode && (
          <header className="no-print bg-white border-b border-gray-200 z-30 shadow-xs flex-shrink-0">
            {/* Primary Top Bar (Symmetrical, Compact & Sophisticated - Item 1) */}
            <div className="h-11 sm:h-12 px-2 sm:px-4 flex items-center justify-between gap-1.5 sm:gap-2 max-w-full">
              
              {/* Left: Branding & Sidebar Toggle */}
              <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button 
                  onClick={() => setShowTools(!showTools)} 
                  className={`p-1.5 sm:p-2 rounded-md transition-colors ${showTools ? 'bg-gray-900 text-white' : 'hover:bg-gray-100 text-gray-700'}`} 
                  title="Toggle Sidebar Tools"
                >
                  <Icons.Menu size={15} />
                </button>
                <div className="flex items-center gap-1.5 sm:gap-2 pl-1 sm:pl-2 border-l border-gray-200">
                  <img src="chordchartstudio_logo_concept_1790526518580.jpg" alt="Chord Chart Studio Logo" className="h-6 w-6 sm:h-7 sm:w-7 object-contain rounded shadow-xs" />
                  <div className="flex flex-col">
                    <h1 className="text-xs font-black uppercase tracking-wider text-gray-900 leading-none">
                      <span className="hidden xs:inline">Chord Chart Studio</span><span className="xs:hidden">CCS</span> <span className="text-blue-600 font-extrabold text-[10px] hidden sm:inline">Direct</span>
                    </h1>
                  </div>
                </div>
              </div>

              {/* Center / Upfront Core Actions: Symmetrical and Balanced (Visible on Desktop/Tablet) */}
              <div className="hidden md:flex items-center gap-1.5">
                {/* Upfront New / Clear Button */}
                <button 
                  onClick={resetSheet} 
                  className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold uppercase rounded-md bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 border border-gray-200 shadow-2xs transition-all active:scale-95" 
                  title="New Chart (Clear sheet)"
                >
                  <Icons.FilePlus size={13} />
                  <span>New</span>
                </button>

                {/* Upfront Save Button Group with Cloud Priority */}
                <div className="relative flex items-center" ref={saveDropdownRef}>
                  <button 
                    onClick={saveToCloud} 
                    className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-black uppercase rounded-l-md bg-blue-600 hover:bg-blue-700 text-white shadow-xs transition-colors active:scale-95" 
                    title="Save to Cloud (Priority • Web Storage)"
                  >
                    <Icons.Cloud size={13} />
                    <span>Save</span>
                  </button>
                  <button 
                    onClick={() => setShowSaveDropdown(prev => !prev)} 
                    className="px-2 py-1.5 text-xs bg-blue-700 hover:bg-blue-800 text-white rounded-r-md border-l border-blue-500 transition-colors" 
                    title="Save Options"
                  >
                    <i className="fas fa-chevron-down text-[9px]"></i>
                  </button>

                  {showSaveDropdown && (
                    <div className="absolute left-0 top-full mt-1.5 w-60 bg-white border border-gray-200 rounded-lg shadow-xl py-1.5 z-50 text-left animate-in fade-in zoom-in-95">
                      <button 
                        onClick={() => { setShowSaveDropdown(false); saveToCloud(); }} 
                        className="w-full px-3 py-2 text-left hover:bg-blue-50 flex items-start gap-2.5 text-xs font-bold text-gray-800 border-b border-gray-100 transition-colors"
                      >
                        <Icons.Cloud size={15} className="text-blue-600 mt-0.5 shrink-0" />
                        <div>
                          <div className="font-extrabold text-blue-700 flex items-center gap-1.5">
                            Save to Cloud
                            <span className="text-[9px] bg-blue-100 text-blue-800 font-black px-1.5 py-0.2 rounded uppercase">Priority</span>
                          </div>
                          <div className="text-[10px] text-gray-500 font-normal">Web Storage & Cloud Library</div>
                        </div>
                      </button>
                      <button 
                        onClick={() => { setShowSaveDropdown(false); saveJSON(); }} 
                        className="w-full px-3 py-2 text-left hover:bg-gray-50 flex items-start gap-2.5 text-xs font-bold text-gray-700 transition-colors"
                      >
                        <Icons.Download size={15} className="text-gray-500 mt-0.5 shrink-0" />
                        <div>
                          <div className="font-bold text-gray-800">Save to Computer</div>
                          <div className="text-[10px] text-gray-400 font-normal">Download .json backup to computer</div>
                        </div>
                      </button>
                    </div>
                  )}
                </div>

                <input type="file" ref={fileInputRef} onChange={loadJSON} accept=".json" className="hidden" />
                <button 
                  onClick={() => fileInputRef.current?.click()} 
                  className="flex items-center gap-1 px-2.5 py-1.5 text-xs font-bold uppercase rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200 transition-colors" 
                  title="Open .json Chart"
                >
                  <Icons.FolderOpen size={12} />
                  <span>Open</span>
                </button>

                <button 
                  onClick={() => {
                    setDialog({ 
                      type: 'confirm', message: "Load demo sheet? All unsaved changes will be lost.", 
                      onConfirm: () => { setSongState({ past: [], present: getDemoSong(), future: [] }); } 
                    });
                  }} 
                  className="flex items-center gap-1 px-2 py-1.5 text-xs font-bold uppercase rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-200 transition-colors"

                              : ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B']
                            ).map(note => (
                              <button key={note} 
                                onClick={() => {
                                  if (isReadOnly) return;
                                  if (!activeBarInfoRef.current && songRef.current.sections.length > 0) {
                                    const firstSec = songRef.current.sections[0];
                                    if (firstSec.lines.length > 0 && firstSec.lines[0].length > 0) {
                                      const initInfo = { secId: firstSec.id, lineIdx: 0, barIdx: 0, slotIdx: 0 };
                                      setActiveBarInfo(initInfo);
                                      activeBarInfoRef.current = initInfo;
                                    }
                                  }
                                  
                                  // If user had already typed a chord in the current bar and auto-jump is pending,
                                  // tapping the next root note immediately advances to the next bar first!
                                  if (keypadAutoAdvance && keypadPendingJump && keypadJumpTimerRef.current) {
                                    clearKeypadJumpTimer();
                                    advanceToNextBar(activeBarInfoRef.current);
                                  }

                                  const currentInfo = activeBarInfoRef.current;
                                  if (currentInfo) {
                                    updateChord(currentInfo.secId, currentInfo.lineIdx, currentInfo.barIdx, currentInfo.slotIdx || 0, note);
                                    if (keypadAutoAdvance) {
                                      scheduleKeypadAutoJump(currentInfo);
                                    }
                                  }
                                }} 
                                className="py-2 bg-gray-100 hover:bg-blue-600 hover:text-white text-base md:text-lg font-black rounded border border-gray-200 shadow-sm active:scale-95 transition-all text-center"
                              >
                                {note}
                              </button>
                            ))}
                        </div>

                        {/* Chord Qualities Row (works like slash chords: applies directly to active chord without latching to next bar) */}
                        <div className="grid grid-cols-6 sm:grid-cols-12 gap-1">
                            {['m', '7', 'maj7', 'm7', 'sus4', 'sus2', 'dim', 'aug', '9', 'add9', '5', 'maj'].map(qual => (
                              <button key={qual} 
                                onClick={() => {
                                  if (isReadOnly) return;
                                  const currentInfo = activeBarInfoRef.current;
                                  if (currentInfo) {
                                    const s = song.sections.find(sec => sec.id === currentInfo.secId);
                                    const b = s?.lines?.[currentInfo.lineIdx]?.[currentInfo.barIdx];
                                    if (b) {
                                      let curSlotVal = b.slots[currentInfo.slotIdx || 0] || 'C';
                                      const match = curSlotVal.match(/^([A-G][#b♯♭]?)(.*)$/);
                                      if (match) {
                                        const root = match[1];
                                        const slashMatch = curSlotVal.match(/\/[A-G][#b♯♭]?/);
                                        const slashPart = slashMatch ? slashMatch[0] : '';
                                        const modMatch = curSlotVal.match(/(_H|_S|\.|_T)+$/);
                                        const modPart = modMatch ? modMatch[0] : '';
                                        const chordVal = (qual === 'maj' ? root : root + qual) + slashPart + modPart;
                                        updateChord(currentInfo.secId, currentInfo.lineIdx, currentInfo.barIdx, currentInfo.slotIdx || 0, chordVal);
                                        if (keypadAutoAdvance) {
                                          scheduleKeypadAutoJump(currentInfo);
                                        }
                                      }
                                    }
                                  }
                                }} 
                                className="py-1.5 text-xs md:text-sm font-bold rounded border active:scale-95 transition-all text-center bg-gray-50 hover:bg-gray-200 text-gray-800 border-gray-200"

                              </button>
                            ))}

                        {/* Slash Bass Chords Row (resets 1s delay) */}

                            <span className="text-[9px] font-black uppercase text-gray-400 px-1 shrink-0">Slash:</span>

                              <button key={bass} 
                                onClick={() => {
                                  if (isReadOnly) return;
                                  const currentInfo = activeBarInfoRef.current;
                                  if (currentInfo) {

                                    const b = s?.lines?.[currentInfo.lineIdx]?.[currentInfo.barIdx];
                                    if (b) {
                                      let cur = b.slots[currentInfo.slotIdx || 0] || 'C';
                                      const modMatch = cur.match(/(_H|_S|\.|_T)+$/);
                                      const modPart = modMatch ? modMatch[0] : '';
                                      if (modPart) cur = cur.slice(0, -modPart.length);
                                      if (cur.includes('/')) cur = cur.split('/')[0];
                                      updateChord(currentInfo.secId, currentInfo.lineIdx, currentInfo.barIdx, currentInfo.slotIdx || 0, cur + bass + modPart);
                                      if (keypadAutoAdvance) {

                                      }
                                    }
                                  }

                            <button onClick={() => { toggleModifier('.'); if (keypadAutoAdvance && activeBarInfoRef.current) scheduleKeypadAutoJump(activeBarInfoRef.current); }} className="px-2 py-1 bg-gray-100 hover:bg-black hover:text-white text-xs font-bold rounded border border-gray-200" title="Dotted Note">Dot (.)</button>
